plugins {
    id 'com.gradleup.shadow'
}

architectury {
	platformSetupLoomIde()
	fabric()
}

configurations {
	common
	shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common
}

loom {
	Project common = project(":common")
//	accessWidenerPath = common.loom.accessWidenerPath

	runs {
		datagen {

			client()

			name "Minecraft Data"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${common.file("src/generated/resources")}"
			vmArg "-Dfabric-api.datagen.modid=${archives_base_name}"
			programArgs "--existing", common.file("src/main/resources").absolutePath

			environmentVariable("DATAGEN", "TRUE")
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	api "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	api "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	common(project(path: ":common")) { transitive false }
	shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

processResources {

}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
    archiveClassifier = "raw"
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()       // Remove default source set inclusion
    from(zipTree(jar.archiveFile))     // Unpack jar output (preserves Loom modifications)

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null           // shadowJar becomes the main artifact
    from rootProject.file("LICENSE.md")
}

sourcesJar {
	def commonSources = project(":common").sourcesJar
	dependsOn commonSources
	from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
	withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
		skip()
	}
}

// configure the maven publication
publishing {
	publications {
		mavenFabric(MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

var env = System.getenv()

var changelogFile = rootProject.file("changelog.md")
var changelogText = changelogFile.exists() ? changelogFile.text : ""
var vName = mod_name + " " + project.version

if (env.MODRINTH_TOKEN) {
	modrinth {
		token = System.getenv("MODRINTH_TOKEN") // This is the default. Remember to have the MODRINTH_TOKEN environment variable set or else this will fail, or set it to whatever you want - just make sure it stays private!
		projectId = modrinth_project_id // This can be the project ID or the slug. Either will work!
		versionName = vName
		versionNumber = project.version // You don't need to set this manually. Will fail if Modrinth has this version already
		versionType = mod_version_type // This is the default -- can also be `beta` or `alpha`
		changelog = changelogText
		uploadFile = remapJar // With Loom, this MUST be set to `remapJar` instead of `jar`!
		gameVersions = minecraft_supported_versions.split(",").toList()
		loaders = ["fabric","quilt"]
		dependencies {
			// scope.type
			// The scope can be `required`, `optional`, `incompatible`, or `embedded`
			// The type can either be `project` or `version`
			required.project "fabric-api"
		}
	}
}

if (env.CURSEFORGE_TOKEN) {
	curseforge {
		apiKey = env.CURSEFORGE_TOKEN
		project {
			id = curseforge_project_id
			changelog = changelogText
			changelogType = 'markdown'
			releaseType = mod_version_type
			for (String v : minecraft_supported_versions.split(",").toList()) {
				addGameVersion v
			}
			addGameVersion "Fabric"
			addGameVersion "Quilt"

			mainArtifact(remapJar) {
				displayName = vName
			}

			relations {
				requiredDependency "fabric-api"
			}
		}
	}
}

