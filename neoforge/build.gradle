plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${neoforge_version}"

    common(project(path: ":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }
}

processResources {

}

jar {
    archiveClassifier = "raw"
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()       // Remove default source set inclusion
    from(zipTree(jar.archiveFile))     // Unpack jar output (preserves Loom modifications)

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = null           // shadowJar becomes the main artifact
    from rootProject.file("LICENSE.md")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}

var changelogFile = rootProject.file("changelog.md")
var changelogText = changelogFile.exists() ? changelogFile.text : ""
var vName = mod_name + " " + project.version

publishMods {
    file = shadowJar.archiveFile
    changelog = changelogText
    version = project.version
    type = me.modmuss50.mpp.ReleaseType.valueOf(mod_version_type)
    displayName = vName

    modLoaders.add("neoforge")

    curseforge("curseforgeNeoForge") {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = curseforge_project_id

        minecraftVersions.addAll(minecraft_supported_versions.split(","))
        javaVersions.add(JavaVersion.VERSION_25)

        clientRequired = true
        serverRequired = true
    }

    modrinth("modrinthNeoforge") {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = modrinth_project_id

        minecraftVersions.addAll(minecraft_supported_versions.split(","))
    }
}